name: German retailer price update
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify offers without database writes'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: german-retailer-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/prices*.test.mjs
      - name: Refresh exact product offers
        id: refresh
        shell: bash
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            node scripts/update-store-prices.mjs --dry-run
          else
            node scripts/update-store-prices.mjs
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: price-update-report
          path: work/price-update-last.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Report freshness and failures
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        run: node scripts/price-update-summary.mjs work/price-update-last.json
