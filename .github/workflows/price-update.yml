name: German retailer price update
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify offers without database writes'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: german-retailer-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/prices*.test.mjs
      - name: Check configured credentials
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Missing Supabase URL secret'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing server service-role secret'; exit 1; }
      - name: Refresh exact product offers
        shell: bash
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            node scripts/update-store-prices.mjs --dry-run
          else
            node scripts/update-store-prices.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-update-report
          path: work/price-update-last.json
          retention-days: 30
          if-no-files-found: ignore
